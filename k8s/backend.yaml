apiVersion: apps/v1
kind: Deployment
metadata:
  name: blinkit-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blinkit-backend
  template:
    metadata:
      labels:
        app: blinkit-frontend # Ensure this matches your Service selector
        app: blinkit-backend
    spec:
      containers:
      - name: backend
        image: 746486152802.dkr.ecr.us-east-1.amazonaws.com/blinkit-backend:v48
        ports:
        - containerPort: 8090
        env:
        - name: PORT
          value: "8090"
        - name: FRONTEND_URL  
          value: "http://a880f442141974bdb99badbaf0c65b25-634400457.us-east-1.elb.amazonaws.com"
        # --- SECURE SECRET REFERENCES ---
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: MONGO_URI
        - name: RESEND_API
          valueFrom:
            secretKeyRef:
              name: resend-credentials
              key: RESEND_API
        - name: SECRET_KEY_REFRESH_TOKEN
          valueFrom:
            secretKeyRef:
              name: jwt-secrets
              key: SECRET_KEY_REFRESH_TOKEN
        - name: SECRET_KEY_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: jwt-secrets
              key: SECRET_KEY_ACCESS_TOKEN
---
apiVersion: v1
kind: Service
metadata:
  name: blinkit-backend-svc
  namespace: default
spec:
  type: LoadBalancer
  ports:
  - port: 8090
    targetPort: 8090
  selector:
    app: blinkit-backend